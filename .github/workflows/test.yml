name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt ruff==0.16.10

      - name: Lint
        run: ruff check cos tests metroplex.py

      - name: Unit tests
        # The Teletraan work service (a separate, local-only checkout) is not
        # available here, so integration tests skip and this job proves the unit
        # layer only. Before merging, run locally with
        # METROPLEX_REQUIRE_INTEGRATION=1 so they fail instead of skipping.
        run: pytest tests/ -q -rs
